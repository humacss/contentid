[package]
name = "contentid"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Deterministic, platform-agnostic, content-derived, decentralized ID generator."
repository = "https://github.com/humacss/contentid"
documentation = "https://docs.rs/contentid"
readme = "README.md"
include = ["/src/**", "/tests/**", "/benches/**", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["id", "deterministic", "content-addressable", "no-std", "hashing"]
categories = ["data-structures", "encoding", "no-std"]

[features]
default = ["std"]
std = ["blake3/std"]
serde = ["dep:serde"]
local = ["std"]

[dependencies]
blake3 = { version = "1", default-features = false }
minbin = { version = "1.0.0", default-features = false, features = ["alloc"] }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "hash_algorithms"
harness = false
required-features = ["local"]

[package.metadata.docs.rs]
all-features = true
